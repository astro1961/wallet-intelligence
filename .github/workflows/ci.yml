name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Unit + integration
        run: uv run pytest -m "not live" --ignore=tests/e2e -q
