[project]
name = "wallet-intelligence"
version = "0.1.0"
description = "Local read-only crypto wallet intelligence tracker and on-chain analytics tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "networkx>=3.3",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
wallet-intelligence = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests as live network integration tests (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["acceptance"]
